<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Runner</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #eff6ff, #dbeafe 35%, #bfdbfe);
      }
      .game-shell {
        background: rgba(255,255,255,0.88);
        border-radius: 18px;
        box-shadow: 0 15px 35px rgba(20, 40, 60, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <h1>Simple Runner</h1>
      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <canvas id="gameCanvas" width="900" height="300" aria-label="Runner game canvas"></canvas>
      <div class="controls">
        <button id="startBtn">Start / Restart</button>
        <p>Jump: Space, W, or ↑</p>
      </div>
    </div>

    <script src="../game.js"></script>
  </body>
</html>
