<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Runner</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #0f172a, #1d4ed8 60%, #60a5fa);
        font-family: Arial, Helvetica, sans-serif;
      }
      .splash {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .logo {
        width: 140px;
        height: 140px;
        border-radius: 24px;
        background: rgba(255,255,255,0.12);
        border: 2px solid rgba(255,255,255,0.45);
        display: grid;
        place-items: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      }
      .logo-inner {
        width: 82px;
        height: 82px;
        border: 4px solid white;
        border-radius: 20px;
        transform: rotate(45deg);
      }
      .title {
        margin-top: 18px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div>
        <div class="logo">
          <div class="logo-inner"></div>
        </div>
        <div class="title">Simple Runner</div>
      </div>
    </div>
  </body>
</html>
