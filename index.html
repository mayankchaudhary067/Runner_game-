<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Runner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <h1>Simple Runner</h1>
      <div class="hud">
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
        <span>Object speed <strong id="objectSpeed">4.2 px/frame</strong></span>
        <span>Time <strong id="timeOfDay">Day</strong></span>
      </div>

      <div class="speed-control">
        <label for="speedControl">Control speed</label>
        <input id="speedControl" type="range" min="0.7" max="2" step="0.1" value="1" />
        <span id="speedValue">1.0x</span>
      </div>

      <canvas id="gameCanvas" width="900" height="300" aria-label="Runner game canvas"></canvas>
      <div class="controls">
        <button id="startBtn">Start / Restart</button>
        <p>Jump: Space or ↑</p>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
